# Render blueprint for the Fin API. Secrets are set in the Render dashboard, never in this file.
services:
  - type: web
    name: fin-api
    runtime: docker
    rootDir: backend
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: FIN_ENV
        value: prod
      - key: FIN_JWT_SECRET
        generateValue: true
      - key: FIN_CRON_SECRET
        generateValue: true
      - key: FIN_ENABLE_SCHEDULER
        value: "true"
      - key: FIN_DATABASE_URL
        sync: false # Supabase session-pooler connection string
      - key: FIN_GEMINI_API_KEY
        sync: false
      - key: FIN_PUBLIC_BASE_URL
        sync: false
