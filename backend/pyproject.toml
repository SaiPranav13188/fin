[project]
name = "fin-backend"
version = "0.1.0"
description = "Fin API: bill splitting with an agentic AI system"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "apscheduler>=3.11.3",
    "email-validator>=2.4.0",
    "fastapi>=0.163.1",
    "google-genai>=3.3.0",
    "langgraph>=1.2.22",
    "mcp>=2.3.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.34",
    "redis>=8.1.0",
    "sentry-sdk[fastapi]>=2.75.0",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["B008", "E731", "B905", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "B017"]
