name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Tests (includes the agent eval gate)
        run: uv run pytest -q
      - name: Agent eval report
        run: uv run python -m evals.runner | tail -n 25
      - name: Migrations apply cleanly
        run: FIN_DATABASE_URL=sqlite:///./ci.db uv run alembic upgrade head

  backend-postgres:
    # Same tests on real Postgres, which enforces foreign keys and types more strictly than SQLite.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Tests on Postgres
        run: uv run pytest -q
      - name: Migrations apply cleanly on Postgres
        run: |
          uv run python -c "import psycopg; psycopg.connect('postgresql://postgres:ci-only@localhost:5432/postgres', autocommit=True).execute('CREATE DATABASE migcheck')"
          FIN_DATABASE_URL=postgresql://postgres:ci-only@localhost:5432/migcheck uv run alembic upgrade head

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit

  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t fin-backend backend
